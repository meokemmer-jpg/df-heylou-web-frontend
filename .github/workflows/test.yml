name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: df-heylou-web-frontend/package-lock.json
      - run: npm ci
        working-directory: df-heylou-web-frontend
      - run: npm run test
        working-directory: df-heylou-web-frontend
        env:
          HEYLOU_WEB_SANDBOX: "true"
  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: df-heylou-web-frontend/package-lock.json
      - run: npm ci
        working-directory: df-heylou-web-frontend
      - run: npx playwright install --with-deps chromium
        working-directory: df-heylou-web-frontend
      - run: npm run build
        working-directory: df-heylou-web-frontend
        env:
          HEYLOU_WEB_SANDBOX: "true"
      - run: npm run test:e2e
        working-directory: df-heylou-web-frontend
        env:
          HEYLOU_WEB_SANDBOX: "true"
          CI: "true"
